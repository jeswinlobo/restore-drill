x-linkwarden: &linkwarden
  image: ghcr.io/linkwarden/linkwarden:v2.7.1@sha256:bbd22798ee726184d4571ea4f4d831d57475c86c4965c2bb1c3c2d3de88c728a
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/auth/csrf').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 4s
    timeout: 5s
    retries: 45
    start_period: 15s
x-postgres: &postgres
  image: postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
  healthcheck:
    test: ["CMD", "pg_isready", "-U", "postgres"]
    interval: 3s
    timeout: 3s
    retries: 30
services:
  sourcedb:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${DRILL_SOURCE_DB_PASSWORD:?}
    volumes: [source-db:/var/lib/postgresql/data]
  targetdb:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: ${DRILL_TARGET_DB_PASSWORD:?}
    volumes: [target-db:/var/lib/postgresql/data]
  source:
    <<: *linkwarden
    depends_on:
      sourcedb: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://postgres:${DRILL_SOURCE_DB_PASSWORD:?}@sourcedb:5432/postgres
      NEXTAUTH_URL: http://127.0.0.1:${DRILL_SOURCE_PORT:?}/api/v1/auth
      NEXTAUTH_SECRET: ${DRILL_SOURCE_AUTH_SECRET:?}
      NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
    ports: ["127.0.0.1:${DRILL_SOURCE_PORT:?}:3000"]
    volumes: [source-files:/data/data]
  target:
    <<: *linkwarden
    depends_on:
      targetdb: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql://postgres:${DRILL_TARGET_DB_PASSWORD:?}@targetdb:5432/postgres
      NEXTAUTH_URL: http://127.0.0.1:${DRILL_TARGET_PORT:?}/api/v1/auth
      NEXTAUTH_SECRET: ${DRILL_TARGET_AUTH_SECRET:?}
      NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
    ports: ["127.0.0.1:${DRILL_TARGET_PORT:?}:3000"]
    volumes: [target-files:/data/data]
volumes:
  source-db: {}
  target-db: {}
  source-files: {}
  target-files: {}
